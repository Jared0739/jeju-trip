/* ============================== HELPERS ============================== */

function openNav(query) {
  const encoded = encodeURIComponent(query);
  const appUrl = `nmap://search?query=${encoded}&appname=jejutripapp`;
  const webUrl = `https://map.naver.com/v5/search/${encoded}`;

  const start = Date.now();
  // try to hand off to the Naver Map app
  window.location.href = appUrl;

  // if the app didn't open within ~1.5s (page is still visible / too little time passed
  // for an app-switch to have happened), fall back to the web version in a new tab
  setTimeout(() => {
    if (document.visibilityState !== "hidden" && Date.now() - start < 2200) {
      window.open(webUrl, "_blank");
    }
  }, 1500);
}

function useStoredState(key, initialValue, shared = false) {
  const [value, setValue] = useState(initialValue);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage?.get(key, shared);
        if (!cancelled && res?.value) {
          setValue(JSON.parse(res.value));
        }
      } catch (e) {
        // key doesn't exist yet, fine
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, [key]);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage?.set(key, JSON.stringify(value), shared);
      } catch (e) {
        console.error("storage set failed", e);
      }
    })();
  }, [value, loaded, key]);

  return [value, setValue, loaded];
}

// polls shared storage periodically so family members see each other's updates
function useSharedPoll(key, intervalMs = 4000) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setTick((n) => n + 1), intervalMs);
    return () => clearInterval(t);
  }, [intervalMs]);
  return tick;
}

function daysUntil(date) {
  const now = new Date();
  const diff = Math.ceil((date - now) / (1000 * 60 * 60 * 24));
  return diff;
}

function useCountdown(targetDate) {
  const calc = () => {
    const diff = Math.max(0, targetDate.getTime() - Date.now());
    return {
      days: Math.floor(diff / 86400000),
      hours: Math.floor((diff % 86400000) / 3600000),
      minutes: Math.floor((diff % 3600000) / 60000),
      seconds: Math.floor((diff % 60000) / 1000),
      done: diff <= 0,
    };
  };
  const [t, setT] = useState(calc);
  useEffect(() => {
    const timer = setInterval(() => setT(calc()), 1000);
    return () => clearInterval(timer);
  }, [targetDate]);
  return t;
}

function getTripDayIndex() {
  const now = new Date();
  if (now < TRIP_START) return 0; // before trip
  if (now > TRIP_END) return -1; // after trip
  const diff = Math.floor((now - TRIP_START) / (1000 * 60 * 60 * 24)) + 1;
  return Math.min(Math.max(diff, 1), 5);
}

function CurrencyTool() {
  const [krw, setKrw] = useState("10000");
  const [rate, setRate] = useState(0.0227);
  const [status, setStatus] = useState("loading"); // loading | live | manual
  const [updatedAt, setUpdatedAt] = useState(null);
  const twd = (parseFloat(krw || 0) * parseFloat(rate || 0)).toFixed(0);

  const quickRates = [0.022, 0.0227, 0.023, 0.024];

  const SOURCES = [
    {
      url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json",
      parse: (d) => d?.krw?.twd,
    },
    {
      url: "https://latest.currency-api.pages.dev/v1/currencies/krw.json",
      parse: (d) => d?.krw?.twd,
    },
    {
      url: "https://open.er-api.com/v6/latest/KRW",
      parse: (d) => d?.rates?.TWD,
    },
  ];

  const fetchRate = async () => {
    setStatus("loading");
    for (const src of SOURCES) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 5000);
        const res = await fetch(src.url, { signal: ctrl.signal });
        clearTimeout(t);
        if (!res.ok) continue;
        const data = await res.json();
        const val = src.parse(data);
        if (val && !isNaN(val)) {
          setRate(Number(val));
          setUpdatedAt(new Date().toLocaleString("zh-TW", { hour12: false }));
          setStatus("live");
          return;
        }
      } catch (e) {
        // try next source
      }
    }
    setStatus("manual");
  };

  useEffect(() => { fetchRate(); }, []);

  return (
    <div className="bg-white rounded-2xl border-2 border-[#5B8C5A] p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          <Banknote size={18} color="#5B8C5A" />
          <span className="font-black text-[#4A3728] text-[14px]">韓元 → 台幣快算</span>
        </div>
        <button
          onClick={fetchRate}
          disabled={status === "loading"}
          className="text-[11px] font-bold text-[#5B8C5A] border border-[#5B8C5A] rounded-full px-2.5 py-1"
        >
          {status === "loading" ? "抓取中…" : "🔄 重新抓取"}
        </button>
      </div>
      <div className="flex items-center gap-2">
        <input
          type="number"
          value={krw}
          onChange={(e) => setKrw(e.target.value)}
          className="flex-1 border-2 border-[#E5DCC8] rounded-xl px-3 py-2 text-[14px] font-bold text-[#4A3728]"
        />
        <span className="text-[12px] font-bold text-[#9C8A73]">KRW</span>
      </div>
      <div className="text-center my-2 text-[#C9BBA0]">↓</div>
      <div className="flex items-center gap-2">
        <div className="flex-1 border-2 border-[#5B8C5A] bg-[#EAF3E9] rounded-xl px-3 py-2 text-[16px] font-black text-[#4A3728]">
          {twd}
        </div>
        <span className="text-[12px] font-bold text-[#9C8A73]">TWD</span>
      </div>

      <div className="flex items-center gap-2 mt-3 text-[11px] text-[#9C8A73]">
        <span>匯率</span>
        <input
          type="number"
          step="0.0001"
          value={rate}
          onChange={(e) => { setRate(e.target.value); setStatus("manual"); }}
          className="w-24 border-2 border-[#5B8C5A] rounded-lg px-2 py-1 text-[11px] font-bold text-[#4A3728]"
        />
        <span>／1韓元</span>
      </div>

      {status === "manual" && (
        <div className="flex gap-1.5 mt-2 flex-wrap">
          {quickRates.map((r) => (
            <button
              key={r}
              onClick={() => setRate(r)}
              className="text-[10.5px] font-bold px-2.5 py-1 rounded-full border"
              style={{
                background: rate === r ? "#5B8C5A" : "white",
                color: rate === r ? "white" : "#5B8C5A",
                borderColor: "#5B8C5A",
              }}
            >
              {r}
            </button>
          ))}
        </div>
      )}

      {status === "live" && (
        <p className="text-[10px] text-[#5B8C5A] mt-2">✓ 已抓取即時匯率，更新於 {updatedAt}</p>
      )}
      {status === "manual" && (
        <p className="text-[10px] text-[#D98C9E] mt-2">⚠️ 即時抓取失敗，已改為手動模式，請自行輸入匯率或點選上方快速選項</p>
      )}
    </div>
  );
}

        <button onClick={() => setShowAdd(true)} className="w-full flex items-center justify-center gap-1.5 border-2 border-dashed border-[#D98C9E] text-[#D98C9E] font-bold rounded-xl py-2.5 text-[13px]">
          <Plus size={16} /> 新增一筆花費
        </button>
      ) : (
        <div className="space-y-2 bg-[#FFF8F5] rounded-xl p-3">
          <div className="flex gap-1.5 overflow-x-auto">
            {DAY_META.map((d) => (
              <button key={d.day} onClick={() => setDay(d.day)} className="shrink-0 px-3 py-1 rounded-full text-[11.5px] font-bold border-2"
                style={{ background: day === d.day ? d.color : "white", color: day === d.day ? "white" : d.color, borderColor: d.color }}>
                Day{d.day}
              </button>
            ))}
          </div>
          <div className="flex gap-1.5 flex-wrap">
            {EXPENSE_CATEGORIES.map((c) => (
              <button key={c.key} onClick={() => setCat(c.key)} className="px-2.5 py-1 rounded-full text-[11.5px] font-bold border-2"
                style={{ background: cat === c.key ? "#D98C9E" : "white", color: cat === c.key ? "white" : "#D98C9E", borderColor: "#D98C9E" }}>
                {c.icon} {c.label}
              </button>
            ))}
          </div>
          <input type="number" placeholder="金額（韓元）" value={amount} onChange={(e) => setAmount(e.target.value)}
            className="w-full border-2 border-[#E5DCC8] rounded-xl px-3 py-2 text-[13.5px] font-bold text-[#4A3728]" />
          <input type="text" placeholder="備註（選填）" value={note} onChange={(e) => setNote(e.target.value)}
            className="w-full border-2 border-[#E5DCC8] rounded-xl px-3 py-2 text-[13px] text-[#4A3728]" />
          <div className="flex gap-2">
            <button onClick={() => setShowAdd(false)} className="flex-1 border-2 border-[#E5DCC8] text-[#9C8A73] font-bold rounded-xl py-2 text-[13px]">取消</button>
            <button onClick={addItem} className="flex-1 bg-[#D98C9E] text-white font-bold rounded-xl py-2 text-[13px]">儲存</button>
          </div>
        </div>
      )}
    </div>
  );
}

function FamilyNotes() {
  const [notes, setNotes] = useStoredState("jeju-family-notes", [], true);
  const [name, setName] = useState("");
  const [text, setText] = useState("");

  const addNote = () => {
    if (!text.trim()) return;
    const next = [...notes, { id: Date.now(), name: name.trim() || "家人", text: text.trim() }];
    setNotes(next);
    setText("");
  };
  const removeNote = (id) => setNotes(notes.filter((n) => n.id !== id));

  return (
    <div className="bg-white rounded-2xl border-2 border-[#8B6FB7] p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          <MessageCircleHeart size={18} color="#8B6FB7" />
          <span className="font-black text-[#4A3728] text-[14px]">家庭共享備註</span>
        </div>
        <span className="text-[10px] text-[#B3A88F] flex items-center gap-1"><Users size={12} /> 家人共用</span>
      </div>

      {notes.length > 0 && (
        <div className="space-y-2 mb-3 max-h-52 overflow-y-auto">
          {[...notes].reverse().map((n) => (
            <div key={n.id} className="bg-[#F0EBF7] rounded-xl p-2.5">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-black text-[#8B6FB7]">{n.name}</span>
                <button onClick={() => removeNote(n.id)}><Trash2 size={13} color="#C4B8DB" /></button>
              </div>
              <p className="text-[13px] text-[#4A3728] mt-1 leading-relaxed">{n.text}</p>
            </div>
          ))}
        </div>
      )}

      <div className="flex gap-2 mb-2">
        <input type="text" placeholder="你的稱呼" value={name} onChange={(e) => setName(e.target.value)}
          className="w-24 border-2 border-[#E5DCC8] rounded-xl px-2.5 py-2 text-[12.5px] text-[#4A3728]" />
        <input type="text" placeholder="留言給家人..." value={text} onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addNote()}
          className="flex-1 border-2 border-[#E5DCC8] rounded-xl px-3 py-2 text-[12.5px] text-[#4A3728]" />
      </div>
      <button onClick={addNote} className="w-full bg-[#8B6FB7] text-white font-bold rounded-xl py-2 text-[13px]">送出留言</button>
    </div>
  );
}

    <div className="px-4 pt-4 pb-24 space-y-5">

        <div className="flex justify-between"><span className="text-[#9C8A73] font-bold">去程</span><span className="font-bold text-[#4A3728]">ZE886　02:50桃園起飛／06:05抵濟州</span></div>
        <div className="flex justify-between"><span className="text-[#9C8A73] font-bold">回程</span><span className="font-bold text-[#4A3728]">ZE885　22:40濟州起飛／隔日00:05抵桃園</span></div>
        <div className="flex justify-between"><span className="text-[#9C8A73] font-bold">航廈</span><span className="font-bold text-[#4A3728]">易斯達航空・桃園第一航廈</span></div>
      </div>

      <SectionTitle icon={<Car size={18} color="#4A3728" />}>租車資訊</SectionTitle>

        <div className="flex justify-between"><span className="text-[#9C8A73] font-bold">預訂號碼</span><span className="font-bold text-[#4A3728]">26-22-522482</span></div>
        <div className="flex justify-between"><span className="text-[#9C8A73] font-bold">取車</span><span className="font-bold text-[#4A3728]">10/17 07:30，濟州機場</span></div>
        <div className="flex justify-between"><span className="text-[#9C8A73] font-bold">還車</span><span className="font-bold text-[#4A3728]">10/21 19:30，濟州機場</span></div>
      </div>

      <SectionTitle icon={<HotelIcon size={18} color="#4A3728" />}>住宿資訊</SectionTitle>

          </div>
        ))}
      </div>

      <CurrencyTool />

      <SectionTitle icon={<Wallet size={18} color="#4A3728" />}>記帳與備註</SectionTitle>
      <ExpenseTracker />
      <FamilyNotes />
      <WeatherCard />

      <SectionTitle icon={<ListChecks size={18} color="#4A3728" />}>出發前檢查清單（{doneCount}／{CHECKLIST_ITEMS.length}）</SectionTitle>
      <div className="bg-white rounded-2xl border-2 border-[#4A3728] p-2">
        {CHECKLIST_ITEMS.map((it, i) => (
          <button
            key={i}
            onClick={() => toggleCheck(i)}
            className="w-full flex items-center gap-3 p-2.5 text-left"
          >
            {checklist[i] ? <CheckCircle2 size={20} color="#5B8C5A" /> : <Circle size={20} color="#C9BBA0" />}
            <span className={`text-[13.5px] font-bold ${checklist[i] ? "text-[#B3A88F] line-through" : "text-[#4A3728]"}`}>{it}</span>
          </button>

              <button onClick={() => setShowEmergency(false)}><X size={22} color="#9C8A73" /></button>
            </div>
            <div className="space-y-2 text-[13.5px]">
              <div className="flex justify-between bg-[#FCEAE8] rounded-xl p-3"><span className="font-bold text-[#4A3728]">警察／消防</span><span className="font-black text-[#E8524A]">112／119</span></div>

              </div>

      <p className="text-center text-[11px] text-[#B3A88F] pt-2">濟州小旅行・我們的家族時光 🐷🍊</p>

  );
}

/* ============================== APP SHELL ============================== */

const TABS = [
  { key: "today", label: "今日", icon: Home },
  { key: "itinerary", label: "行程", icon: CalendarDays },
  { key: "map", label: "地圖", icon: MapPin },
  { key: "food", label: "美食", icon: UtensilsCrossed },
  { key: "more", label: "更多", icon: MoreHorizontal },
];

function App() {
  const [tab, setTab] = useState("today");
  const [activeDay, setActiveDay] = useState(Math.max(getTripDayIndex(), 1));
  const [completed, setCompleted] = useStoredState("jeju-completed-items", {});
  const [checklist, setChecklist] = useStoredState("jeju-checklist", {});

  const toggleDone = (id) => setCompleted((c) => ({ ...c, [id]: !c[id] }));
  const toggleCheck = (i) => setChecklist((c) => ({ ...c, [i]: !c[i] }));

  return (
    <div className="min-h-screen bg-[#FFF6EC]" style={{ fontFamily: "'Noto Sans TC','PingFang TC',sans-serif", colorScheme: "light" }}>
      <style>{`
        html, body, #root { background-color: #FFF6EC !important; color-scheme: light; }
      `}</style>
      <div className="max-w-md mx-auto relative min-h-screen bg-[#FFF6EC]">
        {/* Top bar */}
        <div
          className="sticky top-0 z-20 bg-[#FFF6EC] px-4 flex items-center gap-2 border-b-2 border-[#F0E4D0]"
          style={{ height: "56px", boxSizing: "border-box" }}
        >
          <span className="text-xl">🐷</span>
          <span className="font-black text-[#4A3728] text-[16px]">濟州小旅行</span>
          <span className="text-xl ml-auto">🍊</span>
        </div>

        {/* Views */}
        {tab === "today" && (
          <TodayView setTab={setTab} setActiveDay={setActiveDay} completed={completed} toggleDone={toggleDone} />
        )}
        {tab === "itinerary" && (
          <ItineraryView activeDay={activeDay} setActiveDay={setActiveDay} completed={completed} toggleDone={toggleDone} />
        )}
        {tab === "map" && <MapView />}
        {tab === "food" && <FoodView />}
        {tab === "more" && <MoreView checklist={checklist} toggleCheck={toggleCheck} />}

        {/* Bottom nav */}
        <div className="fixed bottom-0 left-0 right-0 z-20">
          <div className="max-w-md mx-auto bg-white border-t-2 border-[#EFE6D6] flex px-1 py-1.5">
            {TABS.map((t) => {
              const Icon = t.icon;
              const active = tab === t.key;
              return (
                <button
                  key={t.key}
                  onClick={() => setTab(t.key)}
                  className="flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-xl"
                >
                  <Icon size={20} color={active ? "#E8524A" : "#B3A88F"} strokeWidth={active ? 2.6 : 2} />
                  <span className="text-[10px] font-bold" style={{ color: active ? "#E8524A" : "#B3A88F" }}>
                    {t.label}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}


try {
  createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  document.getElementById("err-box").style.display = "block";
  document.getElementById("err-box").textContent = "渲染錯誤：\n" + e.message + "\n" + e.stack;
}
</script>
</body>
</html>
